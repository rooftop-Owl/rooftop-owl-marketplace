name: bump-pin
on:
  repository_dispatch:
    types: [plugin-updated]
jobs:
  bump:
    runs-on: ubuntu-latest
    concurrency:
      group: bump-pin
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Validate allowlist
        env:
          ALLOWED: "astraea skill-factory aeolus-agents dart-agents climada-agents wrf-chem-agents research-zotero slideaway notion-ao-research ephemeris"
          PLUGIN: ${{ github.event.client_payload.plugin }}
        run: |
          if ! echo "$ALLOWED" | grep -qw "$PLUGIN"; then
            echo "ERROR: plugin '$PLUGIN' not in allowlist" >&2
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Validate repo against marketplace.json source
        env:
          PLUGIN: ${{ github.event.client_payload.plugin }}
          REPO: ${{ github.event.client_payload.repo }}
        run: |
          EXPECTED_REPO=$(jq -r --arg name "$PLUGIN"             '.plugins[] | select(.name==$name) | .source.url
             | ltrimstr("https://github.com/") | rtrimstr(".git")'             .claude-plugin/marketplace.json)
          if [ -z "$EXPECTED_REPO" ]; then
            echo "ERROR: plugin '$PLUGIN' not found in marketplace.json" >&2
            exit 1
          fi
          if [ "$REPO" != "$EXPECTED_REPO" ]; then
            echo "ERROR: repo '$REPO' does not match marketplace source '$EXPECTED_REPO'" >&2
            exit 1
          fi

      - name: Resolve plugin version
        env:
          REPO: ${{ github.event.client_payload.repo }}
          SHA: ${{ github.event.client_payload.sha }}
          PAYLOAD_VERSION: ${{ github.event.client_payload.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Primary path: the dispatching repo sends its plugin.json `.version`
          # in the client_payload (its notify-marketplace.yml checks out main
          # and reads it locally). This avoids the marketplace having to fetch
          # a PRIVATE sibling repo's contents — which 404s, because
          # secrets.GITHUB_TOKEN is scoped to THIS repo and cannot read a
          # private slideaway/astraea/etc. That cross-repo fetch is the bug
          # that stranded every private plugin's pin (see bump-pin failure
          # history from ~2026-05-28). PAYLOAD_VERSION is read from env (set
          # above) rather than inlined as a workflow expression, so a hostile
          # version string cannot inject shell — though the dispatch is
          # PAT-gated and trusted regardless.
          VERSION="$PAYLOAD_VERSION"
          if [ -n "$VERSION" ]; then
            echo "Using version from client_payload: $VERSION"
          else
            # Legacy fallback: a repo whose notify-marketplace.yml has NOT been
            # migrated to send `version` yet. Try the fetch — it succeeds for
            # PUBLIC repos and still 404s for private ones. Loud diagnostic so
            # the red run self-documents as "needs migration" rather than a
            # cryptic 404.
            echo "WARNING: client_payload.version absent — '${REPO}' still sends the legacy payload." >&2
            echo "  Migrate its .github/workflows/notify-marketplace.yml to send plugin.json .version." >&2
            echo "  Falling back to fetching plugin.json (404s for private repos)." >&2
            if ! gh api "repos/${REPO}/contents/.claude-plugin/plugin.json?ref=${SHA}" \
                   -H "Accept: application/vnd.github.raw" > fetched-plugin.json 2>fetch.err; then
              echo "ERROR: failed to fetch plugin.json from ${REPO}@${SHA}" >&2
              cat fetch.err >&2
              exit 1
            fi
            VERSION=$(jq -r '.version // empty' fetched-plugin.json)
          fi
          if [ -z "$VERSION" ]; then
            echo "ERROR: could not determine version for ${REPO}@${SHA}" >&2
            exit 1
          fi
          echo "PLUGIN_NEW_VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Patch and push marketplace.json
        env:
          PLUGIN: ${{ github.event.client_payload.plugin }}
          SHA: ${{ github.event.client_payload.sha }}
          NEW_VERSION: ${{ env.PLUGIN_NEW_VERSION }}
        run: |
          COUNT=$(jq --arg name "$PLUGIN" '[.plugins[] | select(.name==$name)] | length' .claude-plugin/marketplace.json)
          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: plugin '$PLUGIN' not found in marketplace.json" >&2
            exit 1
          fi
          # Patch BOTH .source.sha and .version in a single jq pass.
          # Prior behavior patched only .source.sha; the version field would drift
          # silently while pointing at content with a different version. Bumping
          # both keeps marketplace.json consistent with the plugin's plugin.json
          # at the pinned SHA.
          jq --arg name "$PLUGIN" --arg sha "$SHA" --arg ver "$NEW_VERSION" \
             '(.plugins[] | select(.name==$name) | .source.sha) = $sha
              | (.plugins[] | select(.name==$name) | .version) = $ver' \
             .claude-plugin/marketplace.json > tmp.json
          mv tmp.json .claude-plugin/marketplace.json
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add .claude-plugin/marketplace.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore(marketplace): bump ${PLUGIN} to ${NEW_VERSION} (${SHA})"
          # Push with rebase-retry. The job-level concurrency group serializes
          # most runs, but a burst of near-simultaneous dispatches (e.g. a
          # multi-plugin release) still races: a second run commits against a
          # main that a first run already advanced, so its push is rejected
          # non-fast-forward. Rebasing our single bump commit onto the updated
          # main and retrying resolves it; distinct plugins touch distinct
          # marketplace.json lines so the rebase is clean. A same-plugin
          # collision (rare) would conflict and fail loud, recoverable by
          # re-dispatching. Random backoff de-syncs concurrent retriers.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "pushed on attempt ${attempt}"
              exit 0
            fi
            echo "push rejected (attempt ${attempt}) — rebasing onto origin/main and retrying" >&2
            sleep $(( (RANDOM % 4) + 1 ))
            if ! git pull --rebase origin main; then
              echo "ERROR: rebase onto origin/main failed (likely a same-plugin concurrent bump); re-dispatch to retry" >&2
              exit 1
            fi
          done
          echo "ERROR: push still rejected after 5 rebase-retry attempts" >&2
          exit 1
